<!DOCTYPE html>
<html>

<head>
  <title>Find in page</title>
  <meta charset="utf-8">

  <script type="text/javascript" src="assets/js/jquery-3.3.1.min.js"></script>
  <script type="text/javascript" src="assets/js/popper.min.js"></script>
  <script type="text/javascript" src="assets/js/bootstrap.min.js"></script>
  <script type="text/javascript" src="assets/js/fontawesome.js"></script>

  <script type="text/javascript" src="assets/js/knockout-3.5.1.js"></script>
  <script type="text/javascript" src="assets/js/knockout-i18n.js"></script>

  <script type="text/javascript" src="common.js"></script>
  <script type="text/javascript" src="config-utils.js"></script>
  <script type="text/javascript" src="search.js"></script>

  <link rel="stylesheet" href="assets/css/all.min.css" />
  <link rel="stylesheet" href="webui.css" />
  <link rel="stylesheet" href="settings.css" />

  <link rel="icon" href="assets/icons/damecon_icon_48.png" />
</head>
<body>
  <!-- ko if: config -->
  <div id="root" data-bind="attr: { class: `theme-${config().window.style.theme} brightness-${config().window.style.brightness}` }, event: { keydown: rootKeyDown }">
    <div class="toolbar search-bar">
      <div>
        <label for="search-input">Find:</label>
      </div>
      <div class="find-bar input-bar">
        <div class="input-backdrop"></div>
        <input id="search-input" type="text" placeholder="find in page" data-bind="value: searchInput, valueUpdate: 'afterkeydown', event: { keydown: onKeyDown }"/>
      </div>
      <!-- ko if: searchResult() && searchInput().length > 0 -->
      <div class="find-results">
        <label data-bind="text: searchResult().activeMatchOrdinal"></label>
        <label>/</label>
        <label data-bind="text: searchResult().matches"></label>
      </div>
      <!-- /ko -->
      <div class="close-controls">
        <button type="button" class="control btn btn-outline-secondary btn-sm" data-bind="click: closeSearch, clickBubble: false" title="close search"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
  </div>
  <!-- /ko -->
</body>
</html>
