name: CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/**'
      - 'extensions/**'
      - 'scripts/**'
      - '.gitmodules'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/test.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        uses: GabrielBB/xvfb-action@b706e4e27b14669b486812790492dc50ca16b465 # v1.7
        with:
          run: yarn test

      - name: Run recommendation tests (Windows)
        if: runner.os == 'Windows'
        run: yarn test:recommendation

      - name: Run extension tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          yarn test:extensions 2>&1 | Tee-Object -FilePath extension-tests.log
          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            $tail = Get-Content extension-tests.log -Tail 80 | Out-String
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows extension tests failed::$escaped"
            exit $exitCode
          }
