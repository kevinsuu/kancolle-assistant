name: Sync official Damecon

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-official-damecon
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: planetarian/damecon-browser
  UPSTREAM_BRANCH: electron25
  MIRROR_BRANCH: electron25
  CUSTOM_BRANCH: ${{ vars.CUSTOM_BRANCH || 'main' }}
  SYNC_TOKEN_CONFIGURED: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the clean mirror branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.MIRROR_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Verify the synchronization token
        if: env.SYNC_TOKEN_CONFIGURED != 'true'
        shell: bash
        run: |
          echo "::error::UPSTREAM_SYNC_TOKEN is required so synchronized pushes and pull requests trigger CI."
          exit 1

      - name: Fast-forward from the official repository
        id: sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"

          if ! git ls-remote --exit-code --heads origin "${CUSTOM_BRANCH}" >/dev/null; then
            echo "::error::Custom branch '${CUSTOM_BRANCH}' does not exist on origin."
            exit 1
          fi

          git fetch upstream "${UPSTREAM_BRANCH}"

          before="$(git rev-parse HEAD)"
          git merge --ff-only "upstream/${UPSTREAM_BRANCH}"
          after="$(git rev-parse HEAD)"

          if [ "${before}" = "${after}" ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git push origin "HEAD:${MIRROR_BRANCH}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Open an upstream sync pull request
        id: pull-request
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        run: |
          pull_request_url="$(
            gh pr list \
              --base "${CUSTOM_BRANCH}" \
              --head "${MIRROR_BRANCH}" \
              --state open \
              --json url \
              --jq '.[0].url'
          )"

          if [ -z "${pull_request_url}" ]; then
            pull_request_url="$(
              gh pr create \
                --base "${CUSTOM_BRANCH}" \
                --head "${MIRROR_BRANCH}" \
                --title "chore: sync official Damecon" \
                --body "Automated sync from planetarian/damecon-browser:${UPSTREAM_BRANCH}."
            )"
          fi

          echo "Upstream sync PR: ${pull_request_url}"
          echo "url=${pull_request_url}" >> "${GITHUB_OUTPUT}"

      - name: Enable auto-merge when explicitly configured
        if: steps.sync.outputs.changed == 'true' && vars.UPSTREAM_AUTO_MERGE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        run: |
          gh pr merge --auto --merge "${{ steps.pull-request.outputs.url }}"
