name: Validate release metadata

on:
  pull_request:
    paths:
      - 'packages/shell/package.json'
      - 'README.md'
      - 'README.zh-TW.md'
      - 'README.zh-CN.md'
      - 'README.ja.md'
      - '.github/release.yml'
      - '.github/workflows/release-metadata.yml'

permissions:
  contents: read

jobs:
  validate-version-documentation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require all localized READMEs when the app version changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          read_version='let input = "";'
          read_version+='process.stdin.on("data", chunk => input += chunk);'
          read_version+='process.stdin.on("end", () => console.log(JSON.parse(input).version));'
          base_version="$(git show "${BASE_SHA}:packages/shell/package.json" | node -e "$read_version")"
          head_version="$(node -p "require('./packages/shell/package.json').version")"

          if [[ "$base_version" == "$head_version" ]]; then
            echo "Application version is unchanged ($head_version)."
            exit 0
          fi

          version_tag="v$head_version"
          status=0
          readmes=(README.md README.zh-TW.md README.zh-CN.md README.ja.md)

          for readme in "${readmes[@]}"; do
            if ! git diff --name-only "$BASE_SHA...HEAD" -- "$readme" | grep -Fxq "$readme"; then
              echo "::error file=$readme::$readme must change with app version $version_tag."
              status=1
              continue
            fi

            if ! grep -Fq "\`$version_tag\`" "$readme"; then
              echo "::error file=$readme::$readme must display app version $version_tag."
              status=1
            fi
          done

          exit "$status"
